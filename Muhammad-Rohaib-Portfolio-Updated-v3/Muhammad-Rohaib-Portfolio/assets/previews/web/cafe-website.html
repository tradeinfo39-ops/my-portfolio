<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slow Brew Cafe — Interactive Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#1d3028;font-family:Arial,sans-serif}.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 6%;border-bottom:1px solid #d8d2c4}.logo{font-size:20px;font-weight:900;letter-spacing:-1px}.nav a,.btn{font-size:12px;color:inherit;text-decoration:none;border:1px solid #1d3028;padding:10px 14px}.hero{padding:46px 7% 52px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}.tag{font-size:10px;letter-spacing:2px;color:#9b5d3d}.hero h1{font-size:clamp(35px,6vw,70px);line-height:.94;letter-spacing:-4px;margin:15px 0}.hero p{max-width:410px;color:#67766d;line-height:1.7;font-size:14px}.cup{background:#d8e3cf;border-radius:48% 48% 12px 12px;height:230px;display:grid;place-items:center;font-size:100px}.products{padding:25px 7%;background:#eae5d9}.products h2{font-size:24px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid #1d3028;background:transparent;padding:9px 12px;cursor:pointer}.tabs button.active{background:#1d3028;color:#fff}.status{font-size:13px;min-height:22px;margin-top:12px;color:#9b5d3d}@media(max-width:540px){.hero{grid-template-columns:1fr}.cup{height:130px;font-size:65px}.nav{padding:14px 5%}}</style></head><body><nav class="nav"><div class="logo">SLOW BREW<span style="color:#d86e47">.</span></div><a href="#menu">Explore the menu ↓</a></nav><section class="hero"><div><div class="tag">COFFEE · COMMUNITY · CALM</div><h1>Make room<br>for a better<br>coffee break.</h1><p>Thoughtfully sourced coffee, small-batch bakes and a neighbourhood place to slow down for a moment.</p><a class="btn" href="#menu">Find your usual ↗</a></div><div class="cup">☕</div></section><section class="products" id="menu"><div class="tag">THE MENU</div><h2>What sounds good?</h2><div class="tabs"><button class="active" data-choice="Espresso" >Espresso</button><button data-choice="Cold brew">Cold brew</button><button data-choice="Something sweet">Something sweet</button></div><div class="status" id="choice">Espresso selected — rich, simple, classic.</div></section><script>document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#choice').textContent=b.dataset.choice+' selected — made fresh for you.'}))</script></body></html>
