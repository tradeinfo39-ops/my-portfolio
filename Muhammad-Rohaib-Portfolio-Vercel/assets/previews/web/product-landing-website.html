<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Bites — Interactive Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f2e9;color:#1e211a;font-family:Arial,sans-serif}.nav{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d8d8cc}.logo{font-size:22px;font-weight:900;letter-spacing:-1px}.bag{font-size:11px;border:1px solid #222;padding:9px 12px}.hero{padding:45px 7%;display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}.hero h1{font-size:clamp(40px,7vw,77px);line-height:.9;letter-spacing:-5px;margin:15px 0}.hero p{color:#73776b;line-height:1.7;max-width:400px;font-size:13px}.pack{height:260px;background:#d8fb62;display:grid;place-items:center;transform:rotate(4deg);box-shadow:15px 18px 0 #deded1}.pack span{font-size:40px;font-weight:900;letter-spacing:-3px}.options{display:flex;gap:9px;margin:20px 0}.options button{padding:10px 12px;border:1px solid #262820;background:transparent;cursor:pointer;font-size:11px}.options button.active{background:#24271f;color:white}.add{border:0;background:#24271f;color:white;padding:14px 20px;cursor:pointer}.message{font-size:12px;color:#c36545;min-height:20px;margin-top:10px}@media(max-width:540px){.hero{grid-template-columns:1fr}.pack{height:170px}.hero h1{letter-spacing:-3px}}</style></head><body><nav class="nav"><div class="logo">NOVA BITES<span style="color:#e76b44">.</span></div><div class="bag">BAG <span id="count">0</span></div></nav><section class="hero"><div><div style="font-size:10px;letter-spacing:2px;color:#858878">FUEL FOR THE EVERYDAY</div><h1>Small bar.<br>Big energy.</h1><p>A simple product landing page concept for a modern snack brand. Choose a flavour and add a pack to your sample bag.</p><div class="options"><button class="active" data-flavour="Cocoa" >Cocoa</button><button data-flavour="Peanut" >Peanut</button><button data-flavour="Berry" >Berry</button></div><button class="add" id="add">Add to bag ↗</button><div class="message" id="message" aria-live="polite"></div></div><div class="pack"><span>NOVA<br>BITES</span></div></section><script>let flavour='Cocoa';document.querySelectorAll('[data-flavour]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-flavour]').forEach(x=>x.classList.remove('active'));b.classList.add('active');flavour=b.dataset.flavour;document.querySelector('#message').textContent=flavour+' flavour selected.'}));document.querySelector('#add').addEventListener('click',()=>{const c=document.querySelector('#count');c.textContent=Number(c.textContent)+1;document.querySelector('#message').textContent=flavour+' added to your sample bag.'})</script></body></html>
